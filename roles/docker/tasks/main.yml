---

- block:
    - name: create /etc/apt/keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: download docker apt key
      get_url:
        url: "{{ docker_apt_key }}"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: add docker repo
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] {{ docker_repo_base_url }}/linux/ubuntu {{ ubuntu_codename }} stable"
        state: present
        filename: docker-ce

    - name: install docker ce packages
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
        force_apt_get: yes

    - name: add user to docker group
      user:
        name: "{{ local_username }}"
        append: yes
        groups: docker

  when: not virtual_machine_mode

...
