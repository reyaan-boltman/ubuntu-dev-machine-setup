---

# ---- Bitwarden ----
- name: install bitwarden
  shell: |
    curl -fsSL "{{ bitwarden_deb_url }}" -o /tmp/bitwarden.deb
    apt-get install -y /tmp/bitwarden.deb
    rm -f /tmp/bitwarden.deb
  args:
    creates: /usr/bin/bitwarden

# ---- Postman ----
- name: download postman
  get_url:
    url: "{{ postman_download_url }}"
    dest: /tmp/postman.tar.gz
    mode: '0644'
    timeout: 60

- name: extract postman to /opt
  unarchive:
    src: /tmp/postman.tar.gz
    dest: /opt/
    remote_src: yes
    creates: /opt/Postman/Postman

- name: remove postman tar archive
  file:
    path: /tmp/postman.tar.gz
    state: absent

- name: create postman symlink
  file:
    src: /opt/Postman/Postman
    dest: /usr/local/bin/postman
    state: link

- name: create postman desktop entry
  copy:
    dest: /usr/share/applications/postman.desktop
    mode: '0644'
    content: |
      [Desktop Entry]
      Version=1.0
      Type=Application
      Name=Postman
      Exec=/opt/Postman/Postman
      Icon=/opt/Postman/app/icons/icon_128x128.png
      Categories=Development;
      Terminal=false
      StartupWMClass=postman

# ---- Nextcloud Desktop ----
- name: install nextcloud desktop client
  apt:
    name: nextcloud-desktop
    state: present
    force_apt_get: yes

# ---- Obsidian ----
- name: install obsidian
  shell: |
    DEB_URL=$(curl -fsSL https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | \
      jq -r '.assets[] | select(.name | endswith("amd64.deb")) | .browser_download_url')
    curl -fsSL "$DEB_URL" -o /tmp/obsidian.deb
    apt-get install -y /tmp/obsidian.deb
    rm -f /tmp/obsidian.deb
  args:
    creates: /usr/bin/obsidian

# ---- Slack ----
- name: download slack apt key
  get_url:
    url: "{{ slack_apt_key }}"
    dest: /etc/apt/keyrings/slack.asc
    mode: '0644'

- name: add slack apt repo
  apt_repository:
    repo: "{{ slack_apt_repo }}"
    state: present
    filename: slack

- name: install slack
  apt:
    name: slack-desktop
    state: present
    update_cache: yes
    force_apt_get: yes

# ---- Telegram ----
- name: install telegram
  apt:
    name: telegram-desktop
    state: present
    force_apt_get: yes

# ---- OnlyOffice ----
- name: download onlyoffice apt key
  get_url:
    url: "{{ onlyoffice_apt_key }}"
    dest: /etc/apt/keyrings/onlyoffice.asc
    mode: '0644'

- name: add onlyoffice apt repo
  apt_repository:
    repo: "{{ onlyoffice_apt_repo }}"
    state: present
    filename: onlyoffice

- name: install onlyoffice desktop editors
  apt:
    name: onlyoffice-desktopeditors
    state: present
    update_cache: yes
    force_apt_get: yes

# ---- Claude Code ----
# Claude Desktop is not available for Linux (macOS/Windows only)
- name: install claude code
  shell: npm install -g @anthropic-ai/claude-code
  args:
    creates: /usr/local/bin/claude

...
