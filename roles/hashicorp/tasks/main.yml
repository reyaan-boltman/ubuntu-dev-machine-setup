---

- name: register ubuntu codename
  shell: "sed 's/UBUNTU_CODENAME=//;t;d' /etc/os-release" 
  register: upstream_release

- name: create /etc/apt/keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: download hashicorp apt key
  get_url:
    url: "{{ hashicorp_apt_key }}"
    dest: /etc/apt/keyrings/hashicorp.asc
    mode: '0644'

- name: add hashicorp repo
  apt_repository:
    repo: "{{ hashicorp_repo }}"
    state: present
    filename: hashicorp

- name: install hashicorp packages
  apt:
    name: "{{ hashicorp_packages }}"
    force_apt_get: yes

...
